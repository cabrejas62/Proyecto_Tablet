<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASA CABREJAS BENAVENT</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* Fondo con degradado suave en tonos azules */
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      margin: 0;
      padding: 16px;
      color: #0f172a;
      min-height: 100vh;
    }
    
    /* Encabezado principal */
    h1 {
      text-align: center;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 16px;
      color: #1e3a8a;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* ESTILOS DE ÍCONOS SVG GENERALES */
    .icono-svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      vertical-align: middle;
      display: inline-block;
    }
    
    .icono-grande {
      width: 22px;
      height: 22px;
    }

    /* BARRA DE NAVEGACIÓN */
    .navegacion {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn-nav {
      flex: 1;
      min-width: 130px;
      max-width: 190px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(5px);
      color: #0369a1;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-nav:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.95);
    }
    .btn-nav.activo {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(3, 105, 161, 0.35);
      border: none;
    }

    /* CONTENEDOR DE SECCIONES */
    .seccion-pantalla {
      display: none;
      height: calc(100vh - 130px);
      max-width: 1200px;
      margin: 0 auto;
      overflow-y: auto;
      padding-right: 4px;
    }
    .seccion-pantalla.activa {
      display: block;
    }

    /* ESTILOS DE LIMPIEZA */
    .tarjeta-estancia {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    .cabecera-desplegable {
      width: 100%;
      background: transparent;
      border: none;
      padding: 16px 20px;
      font-size: 17px;
      font-weight: 700;
      color: #0369a1;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .titulo-estancia {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .contenido-tareas {
      display: none;
      padding: 0 20px 16px 20px;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      background: rgba(255, 255, 255, 0.5);
    }
    .contenido-tareas.abierto {
      display: block;
    }
    .tarea-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px dashed #cbd5e1;
    }
    .tarea-item:last-child {
      border-bottom: none;
    }
    .tarea-info { flex: 1; }
    .tarea-nombre { font-weight: 600; font-size: 15px; color: #0f172a; }
    .tarea-frecuencia { font-size: 13px; color: #64748b; margin-top: 2px; }
    .input-frecuencia {
      width: 45px;
      padding: 3px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      text-align: center;
      background: #ffffff;
    }
    .tarea-estado { font-size: 13px; margin-top: 3px; }
    .urgente { color: #dc2626; font-weight: bold; }
    .al-dia { color: #16a34a; font-weight: 600; }

    /* ESTILOS DE RECORDATORIOS */
    .pizarra-contenedor { display: flex; gap: 16px; height: 100%; }
    .columna-pizarra {
      flex: 1;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    .columna-titulo {
      font-weight: 700;
      font-size: 18px;
      text-align: center;
      margin-bottom: 14px;
      color: #0369a1;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .form-pizarra { display: flex; gap: 8px; margin-bottom: 14px; }
    .input-pizarra {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      background: #ffffff;
      outline: none;
    }
    .input-pizarra:focus { border-color: #0284c7; }
    .lista-pizarra { list-style: none; padding: 0; margin: 0; overflow-y: auto; }
    .item-pizarra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.75);
      margin-bottom: 6px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    /* ESTILOS DEL MENÚ SEMANAL */
    .tabla-menu-contenedor {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      overflow-x: auto;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    .tabla-menu { width: 100%; border-collapse: collapse; min-width: 750px; }
    .tabla-menu th, .tabla-menu td {
      border: 1px solid #e2e8f0;
      padding: 10px;
      text-align: center;
    }
    .tabla-menu th {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-size: 14px;
      border-radius: 6px 6px 0 0;
    }
    .tabla-menu .col-tipo {
      background: #f1f5f9;
      font-weight: 700;
      color: #334155;
      width: 100px;
    }
    .input-menu {
      width: 100%;
      height: 110px;
      border: 1px solid transparent;
      resize: none;
      font-family: inherit;
      font-size: 13px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 8px;
      outline: none;
      transition: all 0.2s;
    }
    .input-menu:focus {
      background: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 0 5px rgba(2, 132, 199, 0.3);
    }

    /* ESTILOS DE RUTINARIO */
    .rutina-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    .rutina-panel h3 { margin-top: 0; color: #0369a1; display: flex; align-items: center; gap: 8px; }
    .form-rutina { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .form-rutina input, .form-rutina select {
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      background: #ffffff;
      outline: none;
    }
    .form-rutina input[type="text"] { flex: 2; min-width: 200px; }
    .lista-rutinas { list-style: none; padding: 0; margin: 0; }
    .item-rutina {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .rutina-detalles { display: flex; flex-direction: column; gap: 4px; }
    .rutina-titulo { font-weight: 700; font-size: 16px; color: #0f172a; }
    .rutina-horario { font-size: 13px; color: #64748b; display: flex; align-items: center; gap: 4px; }

    /* ESTILOS DEL CALENDARIO */
    .contenedor-iframe {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    .contenedor-iframe iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* BOTONES GENERALES DE ACCIÓN EN AMARILLO */
    button {
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      color: #0f172a;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(202, 138, 4, 0.3);
    }
    button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
    }
    button.btn-borrar {
      background: linear-gradient(135deg, #fecaca 0%, #fca5a5 100%);
      color: #7f1d1d;
      padding: 6px 10px;
      font-size: 12px;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <h1>
    <!-- Icono Casa SVG -->
    <svg class="icono-svg icono-grande" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    CASA CABREJAS BENAVENT
  </h1>

  <!-- BARRA DE NAVEGACIÓN -->
  <div class="navegacion">
    <button class="btn-nav activo" onclick="cambiarVista('limpieza', event)">
      <svg class="icono-svg" viewBox="0 0 24 24"><path d="M19.36 2.72l-1.08 1.08 2.92 2.92 1.08-1.08c.39-.39.39-1.02 0-1.41l-1.51-1.51c-.39-.39-1.02-.39-1.41 0zM17.13 4.93l-11.8 11.8c-.09.09-.15.21-.17.34l-.82 4.49c-.05.29.04.58.24.78.18.18.43.28.7.28.05 0 .11 0 .16-.01l4.49-.82c.13-.02.25-.08.34-.17l11.8-11.8-4.94-4.89z"/></svg>
      LIMPIEZA
    </button>
    <button class="btn-nav" onclick="cambiarVista('recordatorios', event)">
      <svg class="icono-svg" viewBox="0 0 24 24"><path d="M16 9V4l1 0c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1l1 0v5c0 1.66-1.34 3-3 3v2h5.97v7l1.03 1 1.03-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
      RECORDATORIOS
    </button>
    <button class="btn-nav" onclick="cambiarVista('menu', event)">
      <svg class="icono-svg" viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.45 4.35L6 22h2l.55-8.65C10.54 12.9 12 11.12 12 9V2h-1v7zm8-7h-2c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h1v10h2V2z"/></svg>
      MENÚ SEMANAL
    </button>
    <button class="btn-nav" onclick="cambiarVista('rutinario', event)">
      <svg class="icono-svg" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm3.3 14.71L11 12.41V7h2v4.59l3.71 3.71-1.42 1.41z"/></svg>
      RUTINARIO
    </button>
    <button class="btn-nav" onclick="cambiarVista('calendario', event)">
      <svg class="icono-svg" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
      CALENDARIO
    </button>
  </div>

  <!-- VISTA 1: LIMPIEZA -->
  <div id="vista-limpieza" class="seccion-pantalla activa">
    <div id="app"></div>
  </div>

  <!-- VISTA 2: RECORDATORIOS -->
  <div id="vista-recordatorios" class="seccion-pantalla">
    <div class="pizarra-contenedor">
      <div class="columna-pizarra">
        <div class="columna-titulo">
          <svg class="icono-svg" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
          Lista de Comprar
        </div>
        <div class="form-pizarra">
          <input type="text" id="input-comprar" class="input-pizarra" placeholder="Añadir artículo..." onkeydown="detectarEnter(event, 'comprar')" />
          <button onclick="agregarElementoPizarra('comprar')">+</button>
        </div>
        <ul id="lista-comprar" class="lista-pizarra"></ul>
      </div>

      <div class="columna-pizarra">
        <div class="columna-titulo">
          <svg class="icono-svg" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          Lista de Hacer
        </div>
        <div class="form-pizarra">
          <input type="text" id="input-hacer" class="input-pizarra" placeholder="Añadir tarea..." onkeydown="detectarEnter(event, 'hacer')" />
          <button onclick="agregarElementoPizarra('hacer')">+</button>
        </div>
        <ul id="lista-hacer" class="lista-pizarra"></ul>
      </div>
    </div>
  </div>

  <!-- VISTA 3: MENÚ SEMANAL -->
  <div id="vista-menu" class="seccion-pantalla">
    <div class="tabla-menu-contenedor">
      <table class="tabla-menu">
        <thead>
          <tr>
            <td class="col-tipo"></td>
            <th>Lunes</th><th>Martes</th><th>Miércoles</th><th>Jueves</th><th>Viernes</th><th>Sábado</th><th>Domingo</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="col-tipo">
              <svg class="icono-svg" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>
              Comida
            </td>
            <td><textarea class="input-menu" id="menu-comida-lunes" oninput="guardarMenu()"></textarea></td>
            <td><textarea class="input-menu" id="menu-comida-martes" oninput="guardarMenu()"></textarea></td>
            <td><textarea class="input-menu" id="menu-comida-miercoles" oninput="guardarMenu()"></textarea></td>
            <td><textarea class="input-menu" id="menu-comida-jueves" oninput="guardarMenu()"></textarea></td>
            <td><textarea class="input-menu" id="menu-comida-viernes" oninput="guardarMenu()"></textarea></td>
            <td><textarea class="input-menu" id="menu-comida-sabado" oninput="guardarMenu()"></textarea></td>
            <td><textarea class="input-menu" id="menu-comida-domingo" oninput="guardarMenu()"></textarea></td>
          </tr>
          <tr>
            <td class="col-tipo">
              <svg class="icono-svg" viewBox="0 0 24 24"><path d="M12.3 2c.43 0 .77.35.75.78-.29 5.08 3.65 9.15 8.74 8.97.43-.01.78.33.78.76-.03 5.48-4.5 9.95-9.98 9.99-5.74.04-10.42-4.59-10.42-10.31C2.17 6.64 6.74 2 12.3 2z"/></svg>
              Cena
            </td>
            <td><textarea class="input-menu" id="menu-cena-lunes" oninput="guardarMenu()"></textarea></td>
            <td><textarea class="input-menu" id="menu-cena-martes" oninput="guardarMenu()"></textarea></td>
            <td><textarea class="input-menu" id="menu-cena-miercoles" oninput="guardarMenu()"></textarea></td>
            <td><textarea class="input-menu" id="menu-cena-jueves" oninput="guardarMenu()"></textarea></td>
            <td><textarea class="input-menu" id="menu-cena-viernes" oninput="guardarMenu()"></textarea></td>
            <td><textarea class="input-menu" id="menu-cena-sabado" oninput="guardarMenu()"></textarea></td>
            <td><textarea class="input-menu" id="menu-cena-domingo" oninput="guardarMenu()"></textarea></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- VISTA 4: RUTINARIO -->
  <div id="vista-rutinario" class="seccion-pantalla">
    <div class="rutina-panel">
      <h3>
        <svg class="icono-svg" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Añadir Nueva Rutina
      </h3>
      <div class="form-rutina">
        <input type="text" id="rutina-nombre" placeholder="Ej: Pastilla embarazo" />
        <input type="time" id="rutina-hora" value="08:45" />
        <select id="rutina-frecuencia">
          <option value="diaria">Todos los días</option>
          <option value="laborables">Lunes a Viernes</option>
          <option value="finsemana">Sábados y Domingos</option>
        </select>
        <button onclick="agregarRutina()">Guardar Rutina</button>
      </div>
    </div>
    <ul id="lista-rutinas" class="lista-rutinas"></ul>
  </div>

  <!-- VISTA 5: CALENDARIO -->
  <div id="vista-calendario" class="seccion-pantalla">
    <div class="contenedor-iframe">

  <script>
    // 1. CAMBIO DE VISTAS
    function cambiarVista(nombreVista, e) {
      document.querySelectorAll('.seccion-pantalla').forEach(seccion => {
        seccion.classList.remove('activa');
      });
      document.querySelectorAll('.btn-nav').forEach(boton => {
        boton.classList.remove('activo');
      });

      document.getElementById(`vista-${nombreVista}`).classList.add('activa');
      if (e && e.currentTarget) {
        e.currentTarget.classList.add('activo');
      }
    }

    // 2. LÓGICA DE RUTINARIO Y ALARMAS
    let rutinas = cargarRutinas();
    let ultimasAlarmasEjecutadas = {};

    function cargarRutinas() {
      const guardado = localStorage.getItem("rutinas_hogar_local");
      return guardado ? JSON.parse(guardado) : [
        { id: 1, nombre: "Pastilla embarazo", hora: "08:45", frecuencia: "diaria" }
      ];
    }

    function guardarRutinas() {
      localStorage.setItem("rutinas_hogar_local", JSON.stringify(rutinas));
    }

    function agregarRutina() {
      const nombreInput = document.getElementById("rutina-nombre");
      const horaInput = document.getElementById("rutina-hora");
      const frecuenciaSelect = document.getElementById("rutina-frecuencia");

      const nombre = nombreInput.value.trim();
      const hora = horaInput.value;
      const frecuencia = frecuenciaSelect.value;

      if (!nombre || !hora) return;

      const nuevaRutina = {
        id: Date.now(),
        nombre: nombre,
        hora: hora,
        frecuencia: frecuencia
      };

      rutinas.push(nuevaRutina);
      guardarRutinas();
      renderizarRutinas();
      nombreInput.value = "";
    }

    function eliminarRutina(id) {
      rutinas = rutinas.filter(r => r.id !== id);
      guardarRutinas();
      renderizarRutinas();
    }

    function obtenerTextoFrecuencia(frecuencia) {
      switch(frecuencia) {
        case 'diaria': return 'Todos los días';
        case 'laborables': return 'Lunes a Viernes';
        case 'finsemana': return 'Sábados y Domingos';
        default: return frecuencia;
      }
    }

    function renderizarRutinas() {
      const listaUl = document.getElementById("lista-rutinas");
      listaUl.innerHTML = "";

      rutinas.forEach(rutina => {
        const li = document.createElement("li");
        li.className = "item-rutina";
        li.innerHTML = `
          <div class="rutina-detalles">
            <span class="rutina-titulo">${rutina.nombre}</span>
            <span class="rutina-horario">
              <svg class="icono-svg" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm3.3 14.71L11 12.41V7h2v4.59l3.71 3.71-1.42 1.41z"/></svg>
              ${rutina.hora} - ${obtenerTextoFrecuencia(rutina.frecuencia)}
            </span>
          </div>
          <button class="btn-borrar" onclick="eliminarRutina(${rutina.id})">Borrar</button>
        `;
        listaUl.appendChild(li);
      });
    }

    function reproducirSonidoAlarma() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        
        [0, 0.3, 0.6].forEach(delay => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 880;
          gain.gain.value = 0.3;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.2);
        });
      } catch (e) {
        console.log("Audio no soportado o bloqueado por el navegador");
      }
    }

    function verificarAlarmas() {
      const ahora = new Date();
      const horas = String(ahora.getHours()).padStart(2, '0');
      const minutos = String(ahora.getMinutes()).padStart(2, '0');
      const horaActual = `${horas}:${minutos}`;
      const diaSemana = ahora.getDay();

      rutinas.forEach(rutina => {
        if (rutina.hora === horaActual) {
          const claveEjecucion = `${rutina.id}_${ahora.toDateString()}_${horaActual}`;
          
          if (!ultimasAlarmasEjecutadas[claveEjecucion]) {
            let debeSonar = false;

            if (rutina.frecuencia === 'diaria') debeSonar = true;
            else if (rutina.frecuencia === 'laborables' && diaSemana >= 1 && diaSemana <= 5) debeSonar = true;
            else if (rutina.frecuencia === 'finsemana' && (diaSemana === 0 || diaSemana === 6)) debeSonar = true;

            if (debeSonar) {
              ultimasAlarmasEjecutadas[claveEjecucion] = true;
              reproducirSonidoAlarma();
              alert(`RECORDATORIO DE RUTINA:\n\n${rutina.nombre}`);
            }
          }
        }
      });
    }

    setInterval(verificarAlarmas, 10000);

    // 3. GESTIÓN DEL MENÚ SEMANAL
    const diasSemana = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
    const tiposComida = ['comida', 'cena'];

    function guardarMenu() {
      const datosMenu = {};

        diasSemana.forEach(dia => {
          const id = `menu-${tipo}-${dia}`;
          const elem = document.getElementById(id);
          if (elem) datosMenu[id] = elem.value;
        });
      });
      localStorage.setItem("menu_semanal_local", JSON.stringify(datosMenu));
    }

    function cargarMenu() {
      const guardado = localStorage.getItem("menu_semanal_local");
      if (!guardado) return;
      const datosMenu = JSON.parse(guardado);
      Object.keys(datosMenu).forEach(id => {
        const elem = document.getElementById(id);
        if (elem) elem.value = datosMenu[id];
      });
    }

    // 4. CONFIGURACIÓN DE LIMPIEZA CON ÍCONOS SVG

    const svgSofa = `<svg class="icono-svg" viewBox="0 0 24 24"><path d="M4 18v3h2v-3h12v3h2v-3c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2zM6 6h12v2H6z"/></svg>`;

    const configuracionEstancias = [

    // GENERAMOS LOS DATOS CON "ultimaLimpieza: 0" PARA QUE APAREZCAN PENDIENTES DE INICIO
    function generarDatosIniciales() {
      return configuracionEstancias.map(estancia => ({
        id: estancia.id,
        nombre: estancia.nombre,
        iconoSvg: estancia.iconoSvg,
        tareas: estancia.tareas.map((tarea, index) => ({
          id: `${estancia.id}_t${index}`,
          nombre: tarea.nombre,
          intervaloDias: tarea.intervaloDias,
          ultimaLimpieza: 0 // Cambiado a 0 para que todas estén pendientes
        }))
      }));
    }

    function cargarLimpieza() {
      const guardado = localStorage.getItem("limpieza_hogar_local");
      return guardado ? JSON.parse(guardado) : generarDatosIniciales();
    }

    function guardarLimpieza(datos) {
      localStorage.setItem("limpieza_hogar_local", JSON.stringify(datos));
    }

    function cargarPizarra() {
      const guardado = localStorage.getItem("pizarra_hogar_local");
      return guardado ? JSON.parse(guardado) : { comprar: [], hacer: [] };
    }

    function guardarPizarra(datos) {
      localStorage.setItem("pizarra_hogar_local", JSON.stringify(datos));
    }

    // Reiniciamos los datos del almacenamiento para forzar que aplique la nueva fecha
    localStorage.removeItem("limpieza_hogar_local");

    let estadoApp = cargarLimpieza();
    let estadoPizarra = cargarPizarra();
    let estanciasAbiertas = {};

    function obtenerEstadoCuentaAtras(ultimaLimpieza, intervaloDias) {
      const msPorDia = 86400000;
      const fechaProxima = ultimaLimpieza + (intervaloDias * msPorDia);
      const diferenciaMs = fechaProxima - Date.now();
      const diasRestantes = Math.ceil(diferenciaMs / msPorDia);

      if (diasRestantes <= 0) {
        return { texto: `⚠️ Pendiente (hace ${Math.abs(diasRestantes)} d)`, esUrgente: true };
      }
      return { texto: `✅ Próxima: en ${diasRestantes} día(s)`, esUrgente: false };
    }

    function alternarDesplegable(estanciaId) {
      estanciasAbiertas[estanciaId] = !estanciasAbiertas[estanciaId];
      renderizarLimpieza();
    }

    function marcarLimpio(estanciaId, tareaId) {
      estadoApp = estadoApp.map(estancia => {
        if (estancia.id === estanciaId) {
          estancia.tareas = estancia.tareas.map(tarea => {
            if (tarea.id === tareaId) tarea.ultimaLimpieza = Date.now();
            return tarea;
          });
        }
        return estancia;
      });
      guardarLimpieza(estadoApp);
      renderizarLimpieza();
    }

    function cambiarFrecuencia(estanciaId, tareaId, nuevosDias) {
      const valorNumerico = parseInt(nuevosDias, 10);
      if (isNaN(valorNumerico) || valorNumerico < 1) return;

      estadoApp = estadoApp.map(estancia => {
        if (estancia.id === estanciaId) {
          estancia.tareas = estancia.tareas.map(tarea => {
            if (tarea.id === tareaId) tarea.intervaloDias = valorNumerico;
            return tarea;
          });
        }
        return estancia;
      });
      guardarLimpieza(estadoApp);
      renderizarLimpieza();
    }

    function agregarElementoPizarra(tipo) {
      const input = document.getElementById(`input-${tipo}`);
      const texto = input.value.trim();
      if (!texto) return;

      estadoPizarra[tipo].push(texto);
      guardarPizarra(estadoPizarra);
      input.value = "";
      renderizarPizarra();
    }

    function eliminarElementoPizarra(tipo, indice) {
      estadoPizarra[tipo].splice(indice, 1);
      guardarPizarra(estadoPizarra);
      renderizarPizarra();
    }

    function detectarEnter(evento, tipo) {
      if (evento.key === "Enter") {
        evento.preventDefault();
        agregarElementoPizarra(tipo);
      }
    }

    function renderizarLimpieza() {
      const appContainer = document.getElementById("app");
      appContainer.innerHTML = "";

      estadoApp.forEach(estancia => {
        const estaAbierta = estanciasAbiertas[estancia.id] || false;
        const contenedorTarjeta = document.createElement("div");
        contenedorTarjeta.className = "tarjeta-estancia";

        const botonCabecera = document.createElement("button");
        botonCabecera.className = "cabecera-desplegable";
        botonCabecera.onclick = () => alternarDesplegable(estancia.id);
        botonCabecera.innerHTML = `
          <span class="titulo-estancia">${estancia.iconoSvg || ''} ${estancia.nombre}</span>
          <span>${estaAbierta ? "▲" : "▼"}</span>
        `;

        const contenedorTareas = document.createElement("div");
        contenedorTareas.className = `contenido-tareas ${estaAbierta ? "abierto" : ""}`;

        let htmlTareas = "";
        estancia.tareas.forEach(tarea => {
          const info = obtenerEstadoCuentaAtras(tarea.ultimaLimpieza, tarea.intervaloDias);
          const claseEstado = info.esUrgente ? "urgente" : "al-dia";

          htmlTareas += `
            <div class="tarea-item">
              <div class="tarea-info">
                <div class="tarea-nombre">${tarea.nombre}</div>
                <div class="tarea-frecuencia">
                  Cada 
                  <input 
                    type="number" 
                    class="input-frecuencia" 
                    value="${tarea.intervaloDias}" 
                    min="1"
                    onchange="cambiarFrecuencia('${estancia.id}', '${tarea.id}', this.value)"
                  /> días
                </div>
                <div class="tarea-estado ${claseEstado}">${info.texto}</div>
              </div>
              <button onclick="marcarLimpio('${estancia.id}', '${tarea.id}')">Hecho</button>
            </div>
          `;
        });

        contenedorTareas.innerHTML = htmlTareas;
        contenedorTarjeta.appendChild(botonCabecera);
        contenedorTarjeta.appendChild(contenedorTareas);
        appContainer.appendChild(contenedorTarjeta);
      });
    }

    function renderizarPizarra() {
      ["comprar", "hacer"].forEach(tipo => {
        const listaUl = document.getElementById(`lista-${tipo}`);
        listaUl.innerHTML = "";

        estadoPizarra[tipo].forEach((texto, index) => {
          const li = document.createElement("li");
          li.className = "item-pizarra";
          li.innerHTML = `
            <span>${texto}</span>
            <button class="btn-borrar" onclick="eliminarElementoPizarra('${tipo}', ${index})">✕</button>
          `;
          listaUl.appendChild(li);
        });
      });
    }

    // Inicializar todo
    renderizarLimpieza();
    renderizarPizarra();
    cargarMenu();
    renderizarRutinas();
  </script>

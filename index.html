<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASA CABREJAS BENAVENT</title>
  <style>
    /* Estilos base */
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f2f2f7;
      margin: 0;
      padding: 16px;
      color: #1c1c1e;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 18px;
      margin: 15px 0 10px 0;
      color: #007aff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Layout en 2 columnas para pantalla horizontal (Tablet) */
    .pantalla-horizontal {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      height: calc(100vh - 80px); /* Ocupa el alto de la pantalla */
    }

    /* Columna Izquierda: Limpieza y Recordatorios */
    .columna-izquierda {
      flex: 1;
      overflow-y: auto; /* Permite desplazamiento vertical si el contenido es largo */
      padding-right: 8px;
    }

    /* Columna Derecha: Calendario de Google */
    .columna-derecha {
      flex: 1200;
      display: flex;
      flex-direction: column;
    }

    .contenedor-calendario {
      width: 100%;
      height: 100%;
      min-height: 450px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Estilos de tarjetas y elementos existentes */
    .tarjeta-estancia, .columna-pizarra {
      background-color: #ffffff;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .pizarra-contenedor {
      display: flex;
      gap: 10px;
    }

    /* Ajuste para pantallas pequeñas o móviles si cambias de orientación */
    @media (max-width: 768px) {
      .pantalla-horizontal {
        flex-direction: column;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <h1>CASA CABREJAS BENAVENT</h1>

  <div class="pantalla-horizontal">
    
    <!-- COLUMNA IZQUIERDA: APLICACIÓN ACTUAL -->
    <div class="columna-izquierda">
      <h2>LIMPIEZA</h2>
      <div id="app"></div>

      <h2>RECORDATORIOS</h2>
      <div class="pizarra-contenedor">
        <div class="columna-pizarra" style="flex: 1; padding: 10px;">
          <div style="font-weight: bold; text-align: center; margin-bottom: 8px;">Comprar</div>
          <div style="display: flex; gap: 4px;">
            <input type="text" id="input-comprar" style="width: 100%;" placeholder="Añadir..." />
            <button onclick="agregarElementoPizarra('comprar')">+</button>
          </div>
          <ul id="lista-comprar" style="padding-left: 15px;"></ul>
        </div>

        <div class="columna-pizarra" style="flex: 1; padding: 10px;">
          <div style="font-weight: bold; text-align: center; margin-bottom: 8px;">Hacer</div>
          <div style="display: flex; gap: 4px;">
            <input type="text" id="input-hacer" style="width: 100%;" placeholder="Añadir..." />
            <button onclick="agregarElementoPizarra('hacer')">+</button>
          </div>
          <ul id="lista-hacer" style="padding-left: 15px;"></ul>
        </div>
      </div>
    </div>

    <!-- COLUMNA DERECHA: GOOGLE CALENDAR -->
    <div class="columna-derecha">
      <h2>CALENDARIO</h2>
      <div class="contenedor-calendario">
        <!-- Reemplaza el enlace del src por el iframe de tu Google Calendar -->
        <iframe 
          src="https://calendar.google.com/calendar/embed?src=tu_correo%40gmail.com&ctz=Europe%2FMadrid" 
          style="border: 0" 
          frameborder="0" 
          scrolling="no">
        </iframe>
      </div>
    </div>

  </div>

  <script>
    // Tu código JavaScript de limpieza y recordatorios se mantiene aquí sin cambios
  </script>

</body>
</html>
